# 画面の文言を一元管理するファイル
#
# ここの値を書き換えれば、そのまま画面に反映されます。Hugo のテンプレートが
# HTML に描き込み、ブラウザのスクリプトは js.Build の params で受け取ります
# （layouts/_partials/js.html）。
#   - "..."     1 行の文言
#   - '''...''' 複数行の文言（プロンプトなど）
#   - # で始まる行はコメント
#   - {peak} や {count} のような {波括弧} は、表示の時に数値などへ置き換わります
#   - <b>強調</b> や <code>コード</code> のような簡単な HTML タグも使えます
# 左側のキー名（heading = など）と {波括弧} の中身は変えないでください（機能に紐づくため）。

foot = "ブラウザ内で生成 / データは端末外に出ていません / DM除外 / {time}"
copiedOk = "コピーしました ✓"
copiedFail = "コピー失敗（手動選択してください）"

# LLM に渡すプロンプト（「まとめてコピー」「プロンプトをコピー」の中身）
prompt = '''
# 人格・思想プロファイリング依頼（X投稿ベース）

あなたは計量テキスト心理学に通じた分析者。同梱の資料を読み、この人物の
**無意識的な思想・人格・価値観**を、証拠に基づいて言語化してほしい。

## 資料
- ローカルで機械集計した定量事実（前提として使う）
- 本人の発言（年代別の全文／または代表的な投稿の抜粋）

## 出力してほしい観点（各項目、必ず実際の投稿を引用して裏づける）
1. Big Five（開放性・誠実性・外向性・協調性・神経症傾向）を各5段階で推定＋根拠2〜3件。
2. 価値観（シュワルツの基本価値／道徳基盤）— 何を大事にし、何を軽視/嫌悪するか。
3. 世界観・思想の核 — 繰り返し立ち返るテーマ、物事の捉え方の型（認知の癖）。
4. 対人スタイル — 距離の取り方、ユーモア、攻撃性/防御、自己開示の度合い。
5. セルフイメージ vs 実像 — 見せたい自分と、言葉の端々に出る素の自分のズレ
   （例: 一人称「俺」で強気だが断定率は低く実は慎重、など定量指標との突き合わせ）。
6. 経年の変化 — 関心・感情・文体が年ごとにどう動いたか。
7. 盲点 — 本人が自己認識していなさそうな傾向。

## 姿勢
- これは示唆であって心理診断ではない。断定を避け、確度も添える。
- 決めつけ・レッテル貼りをしない。ネガティブな指摘は根拠と共に慎重に。
- 日本語で、平易に、しかし踏み込んで。'''

# 状態メッセージ
