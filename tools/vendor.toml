# The third-party files this site ships unchanged, and where they come from.
#
# Each package is the npm registry tarball at `tarball`, checked against
# `integrity` (the registry's SHA-512, as npm records it). `files` maps a path
# inside the tarball (below its top folder) to the file in this repository and its
# SHA-256. `mise run vendor` fetches the tarballs and writes the files;
# `mise run check` fails if a file here differs from its SHA-256.
#
# To update a package: change version, tarball, and integrity (from
# https://registry.npmjs.org/<name>/<version>, field dist.integrity), run
# `mise run vendor`, review the SHA-256 it reports for each changed file, and
# write those values here before running it again.

