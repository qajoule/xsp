days = { label = "投稿した日数", sub = "1日平均 {avg} 投稿" }
likes = { label = "いいねした数", sub = "（他人の投稿へ）" }
avgfav = { label = "平均いいね/投稿", sub = "自分の投稿が得た反応" }
follow = { label = "フォロー / フォロワー", sub = "" }
grok = { label = "Grokとの会話", sub = "ブロック {block} / ミュート {mute}" }

