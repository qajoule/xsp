# Type definitions for the code that runs on Bun (test/ and tools/), read by
# tsconfig.bun.json. They are never published. `mise run vendor:types` unpacks
# each whole tarball, except docs/, into .types/<into>/ (not committed), and
# skips a package already unpacked at its version. The tarball integrity is the
# only check, so files are not listed. bun-types needs @types/node and
# undici-types; @types/node follows the Node version Bun reports
# (`bun -e "console.log(process.version)"`, v26.3.0 for Bun 1.4.5), and
# undici-types the range @types/node asks for.

[[types]]
name = "bun-types"
version = "1.4.5"
tarball = "https://registry.npmjs.org/bun-types/-/bun-types-1.4.5.tgz"
integrity = "sha512-ECHn+9dhL3wv0G6u0+7dQvrnaimXiRDxxerYBmhTaLyJEEuvTPWk2Fye3XIf5Y++JIIiHKfQw4Z7V5D8KuiXbg=="
into = "bun-types"

[[types]]
name = "@types/node"
version = "26.3.0"
tarball = "https://registry.npmjs.org/@types/node/-/node-26.3.0.tgz"
integrity = "sha512-L3fgrnchriRC2ExBflb8j4uZZURHZfQsmQeyVzhjcHW4kkwVyo8/0h1B2MVzMTrYUJYu6G7EWs14hW/L9putqw=="
into = "node"

[[types]]
name = "undici-types"
version = "8.3.0"
tarball = "https://registry.npmjs.org/undici-types/-/undici-types-8.3.0.tgz"
integrity = "sha512-j375ScV60dom+YkPFIfTLcOiPxkN/buHz5GobjLhixFuANaNs3C9l4GmrWqejgXWJ7BbJcFYpTEUkS1Ge8bpZQ=="
into = "undici-types"
