[sections.handoff]
heading = "この先：AIに人格を読ませる"
note = "ここまでは淡々とした定量。人格・価値観・世界観の“読み”は、下のどちらかで LLM に委ねます。数分で終わります。DM は含みません。"
# 外部AIへ渡す前の注意（公開サイト設計 9 節の文面）
externalNotice = "このアプリの解析はローカルで完結します。コーパスのダウンロード、コピー、Gemini Notebook などへのアップロードを選んだ場合、その時点からは利用先サービスのデータポリシーが適用されます。"

[sections.handoff.card1]
title = "① Gemini Notebook（おすすめ・全{count}投稿を根拠に）"
