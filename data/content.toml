[sections.psyche]
heading = "無意識の言語指標"
note = "「どう話すか（機能語：一人称・断定/推量）」はほぼ無意識で、人格や心理状態と相関するとされる。ここは辞書ベースの<b>定量</b>指標。意味づけは別途 LLM に委ねる前提。"
series = { assert = "断定率", neg = "否定/千字" }

